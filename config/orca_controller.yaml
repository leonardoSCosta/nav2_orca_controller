controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_orca_controller::OrcaController"
      # ORCA simulator parameters
      time_step: 0.1
      neighbor_dist: 5.0
      max_neighbors: 10
      time_horizon: 3.0
      time_horizon_obst: 1.5
      robot_radius: 0.22
      safety_buffer: 0.10
      max_speed: 0.5

      # Controller parameters
      lookahead_dist: 0.45
      is_holonomic: false
      kw: 1.8
      max_angular_vel: 0.8
      debug_mode: false

      # Goal convergence & approach deceleration
      rotate_to_goal_heading: true
      goal_dist_tolerance: 0.20
      goal_yaw_tolerance: 0.15
      goal_decel_distance: 0.50
      min_approach_speed: 0.06

      # Forward preference & short reversal limits
      allow_short_reversal: true
      min_backward_angle: 2.44          # ~140 deg (rad) required to trigger short reverse
      max_backward_distance: 0.35       # max continuous backward distance (m)
      max_backward_duration: 1.5        # max continuous backward duration (s)
      max_backward_speed: 0.15          # max linear speed while reversing (m/s)
      forward_turn_slowdown_angle: 1.22 # ~70 deg (rad) beyond which robot rotates in-place forward

      # Hybrid Obstacle Clusterer parameters
      cluster_dist_threshold: 0.3
      min_cluster_size: 3
      max_obstacle_radius: 0.25
      filter_scan_by_costmap: true
      costmap_lethal_radius_padding: 1
      polygon_simplification_tolerance: 0.05
      min_polygon_cells: 3
      scan_topic: "scan"
